name: Build Linux packages

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libxkbcommon-dev libwayland-dev libdbus-1-dev
          rustup toolchain install stable --profile minimal
      - name: Build both editions
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*-linux-x86_64.tar.gz
