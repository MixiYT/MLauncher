[package]
name = "mlauncher"
version = "0.3.6"
edition = "2021"
description = "Rust Minecraft launcher with modpacks, resourcepacks and launch diagnostics"
license = "MIT"

# Ускоряет cargo run: SHA/HTTP/ZIP/изображения в зависимостях собираются с оптимизацией.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
default = []
lite = []

[profile.lite]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
fs2 = "0.4"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader"] }

[build-dependencies]
winres = "0.1"
sha2 = "0.10"
